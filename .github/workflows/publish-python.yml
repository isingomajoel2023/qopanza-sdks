# PyPI, on a python-v* tag.
#
# NOTE ON LOCATION: this file is sdks/.github/workflows/ in the source
# repository, where GitHub ignores it — workflows only run from
# .github/workflows at a repository root. The mirror lays sdks/ down at the
# root of qopanza-sdks, which is where it becomes live. That is deliberate:
# the release workflows are versioned alongside the code they release, and
# they cannot fire twice.
#
# Trusted Publishing (OIDC): no API token exists anywhere. PyPI verifies a
# short-lived identity assertion from this workflow instead. One-time setup
# on PyPI, before the first run:
#
#   PyPI -> Publishing -> Add a pending publisher
#     Owner:            isingomajoel2023
#     Repository:       qopanza-sdks
#     Workflow name:    publish-python.yml
#     Environment name: release
#
# Without it the publish step fails with an OIDC error. That failure is
# correct and preferable to a long-lived token in repository secrets — the
# thing that gets exfiltrated in the supply-chain attacks this product
# exists to find.
name: Publish Python SDK

on:
  push:
    tags: ["python-v*"]
  # Exercises build and verification without publishing anything.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The tag is a claim about the version; __init__.py is what the
      # artifact is actually built from. Publishing 0.1.0 under a v0.2.0 tag
      # produces a release nobody can correlate with its source again, and
      # PyPI will not let the version be reused after deletion.
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: python
        run: |
          tag="${GITHUB_REF_NAME#python-v}"
          pkg="$(python -c 'import re,pathlib; print(re.search(r"__version__ = \"([^\"]+)\"", pathlib.Path("qopanza/__init__.py").read_text()).group(1))')"
          echo "tag=$tag package=$pkg"
          [ "$tag" = "$pkg" ] || {
            echo "::error::Tag $GITHUB_REF_NAME implies $tag but qopanza/__init__.py says $pkg."
            exit 1
          }

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Test
        working-directory: python
        run: |
          python -m pip install -e '.[test]'
          python -m pytest tests -v

      - name: Build sdist and wheel
        working-directory: python
        run: python -m build

      - name: Check metadata renders on PyPI
        working-directory: python
        run: python -m twine check dist/*

      # Installing the wheel in a clean venv catches what building cannot:
      # a missing package-data file, a broken entry point, an import that
      # only worked from the source tree.
      - name: Install the wheel clean and smoke-test it
        working-directory: python
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/python -c "import qopanza as q; print(q.__version__); assert 'QopanzaClient' in q.__all__"
          /tmp/verify/bin/qopanza --help

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: python/dist/

  publish:
    needs: build
    # Tags only. workflow_dispatch runs `build` and stops here, so the
    # manual button can never publish by accident.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # The OIDC token PyPI verifies. It is not a PyPI credential and
      # cannot be replayed elsewhere.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
