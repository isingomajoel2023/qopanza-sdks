# The MCP server (qopanza-mcp) to npm, on an mcp-v* tag. A copy of
# publish-npm.yml pointed at mcp-server/ — kept as its own file, not a
# second job there, because npm's trusted publisher is registered per
# package *and* per workflow filename, and a separate tag keeps the two
# packages releasing independently.
#
# Trusted Publishing (OIDC): no token in repository secrets. One-time setup
# on npmjs.com, after the package exists:
#
#   npmjs.com -> the qopanza-mcp package -> Settings -> Trusted publisher
#     Organization or user: isingomajoel2023
#     Repository:           qopanza-sdks
#     Workflow filename:    publish-mcp.yml
#     Environment:          release
#
# For the very first publish the package does not exist yet, so there is
# nothing to attach a trusted publisher to. Publish 0.1.0 once from your
# machine with `npm publish` and 2FA, then configure the trusted publisher
# and let this workflow handle every release after it.
name: Publish MCP server

on:
  push:
    tags: ["mcp-v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: mcp-server
        run: |
          tag="${GITHUB_REF_NAME#mcp-v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package=$pkg"
          [ "$tag" = "$pkg" ] || {
            echo "::error::Tag $GITHUB_REF_NAME implies $tag but package.json says $pkg."
            exit 1
          }

      - name: Install, build, test
        working-directory: mcp-server
        run: |
          npm ci
          npm run build --if-present
          npm test --if-present

      # `npm pack` writes exactly what would be published. Listing it is the
      # cheapest way to catch a `files` field that omits dist/ — the bug
      # where everything passes locally because the file is on disk anyway,
      # and the published package is empty.
      - name: Show what would be published
        working-directory: mcp-server
        run: |
          npm pack --dry-run
          npm pack
          tar -tzf ./*.tgz | sort

      - uses: actions/upload-artifact@v4
        with:
          name: mcp-tarball
          path: mcp-server/*.tgz

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      # Provenance attestation — npm records which workflow and commit built
      # the tarball, and shows it on the package page.
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # OIDC publishing needs a recent npm; the one bundled with Node 22 may
      # predate it. Upgrading here rather than relying on the runner image
      # keeps this working when the image changes underneath us.
      - name: Use an npm that understands trusted publishing
        run: npm install -g npm@latest

      - name: Publish
        working-directory: mcp-server
        run: |
          set -euo pipefail
          npm ci
          npm run build --if-present

          # Re-running an already-successful publish must not go red — the
          # reasoning is in publish-python.yml. npm has no --skip-existing,
          # so the one specific "this version is already published" response
          # is tolerated here and nothing else is: any other failure still
          # fails the job, loudly.
          if npm publish --provenance --access public 2>&1 | tee /tmp/npm-publish.log; then
            exit 0
          fi

          if grep -qiE "cannot publish over|EPUBLISHCONFLICT|previously published" /tmp/npm-publish.log; then
            echo "::notice::This version is already on npm — re-run of a successful publish, not a failure."
            exit 0
          fi

          echo "::error::npm publish failed for a reason other than the version already existing."
          exit 1
