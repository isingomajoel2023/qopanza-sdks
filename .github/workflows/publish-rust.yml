# crates.io, on a rust-v* tag. See publish-python.yml for why this file
# lives under sdks/.github/workflows/ in the source repository.
#
# Trusted Publishing (OIDC). Cargo does not do the OIDC exchange itself, so
# rust-lang/crates-io-auth-action swaps the workflow's identity token for a
# crates.io token that lives about fifteen minutes and is revoked when the
# job ends. One-time setup on crates.io, after the crate exists:
#
#   crates.io -> your crate -> Settings -> Trusted Publishing -> Add
#     Repository owner:  isingomajoel2023
#     Repository name:   qopanza-sdks
#     Workflow filename: publish-rust.yml
#     Environment:       release
#
# `cargo publish` is irreversible and there is no delete. `cargo yank` stops
# new dependants resolving to a version; it does not remove it, and the
# files stay downloadable forever. Hence the dry run below, which fails the
# release before anything is uploaded rather than after.
name: Publish Rust SDK

on:
  push:
    tags: ["rust-v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Tag matches crate version
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: rust
        run: |
          tag="${GITHUB_REF_NAME#rust-v}"
          pkg="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          echo "tag=$tag crate=$pkg"
          [ "$tag" = "$pkg" ] || {
            echo "::error::Tag $GITHUB_REF_NAME implies $tag but Cargo.toml says $pkg."
            exit 1
          }

      - name: Build and test
        working-directory: rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      # Packages the crate exactly as it would be uploaded, and lists the
      # files. `include`/`exclude` mistakes are invisible locally because the
      # files are on disk either way.
      - name: Package and list contents
        working-directory: rust
        run: |
          cargo package --list
          cargo publish --dry-run

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Exchange the OIDC token for a crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish
